name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.lock
      - run: .venv/bin/pip install --no-deps -e .
      - run: .venv/bin/ruff check backend tests scripts
      - run: .venv/bin/ruff format --check backend tests scripts
      - run: .venv/bin/pytest --cov=jarvis --cov-fail-under=80 --cov-report=xml
      - name: Validate migrations
        env:
          JARVIS_DATA_DIR: /tmp/jarvis-ci-migrations
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.lock && .venv/bin/pip install --no-deps -e .
      - run: npm install --global npm@11.21.1
      - run: npm ci --prefix frontend
      - run: npm run test --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm exec --prefix frontend -- playwright install --with-deps chromium
      - run: npm run test:e2e --prefix frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: frontend/test-results/
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jarvis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test built application and inference binaries
        run: |
          docker run --rm --entrypoint whisper-cli jarvis:ci --help
          docker run --rm --entrypoint llama-server jarvis:ci --version
          docker run -d --name jarvis-ci -e JARVIS_TOKEN=ci-only-workspace-access-token -p 8000:8000 jarvis:ci
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/
          curl --fail -H 'Authorization: Bearer ci-only-workspace-access-token' http://127.0.0.1:8000/api/calendars
      - run: docker logs jarvis-ci
        if: failure()
