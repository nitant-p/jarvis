[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-scheduler"
version = "0.1.0"
description = "Private voice-to-calendar scheduler"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3", "alembic>=1.14,<2", "httpx>=0.27,<1",
  "python-multipart>=0.0.20", "mcp>=1.26,<2", "google-auth-oauthlib>=1,<2", "requests>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pip-tools>=7,<8"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/jarvis/api.py" = ["B008"]
"scripts/render_architecture.py" = ["E501"]
